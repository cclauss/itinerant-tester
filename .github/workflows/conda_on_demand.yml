name: conda_on_demand
run-name: conda_on_demand ${{ inputs.conda_command }}
on:
  workflow_dispatch:
    inputs:
      conda_command:
        description: 'conda command'
        required: false
jobs:
  conda_on_demand:
    name: "conda_on_demand: ${{ inputs.conda_command }}"
    runs-on: ubuntu-latest
    env:
      CONDA_COMMAND: ${{ inputs.conda_command }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - run: conda search python
    - if: ${{ inputs.conda_command }}
      run: ${CONDA_COMMAND}
