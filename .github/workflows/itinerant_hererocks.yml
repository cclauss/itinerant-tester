# Can a package be installed on Lua 5.4 and 5.5 on macOS, Ubuntu, and Windows?
# Unlike most other workflows, this one is NOT run on pushes and pull requests.
#
# This workflow is only run ON DEMAND by MAINTAINERS of this repo when they
# want to know if a Lua package can be installed on both Lua 5.4 and 5.5.
#
# https://github.com/cclauss/itinerant-tester/actions/workflows/luarocks_install.yml
# * Click the "Run workflow" button at the upper right of the page.
#     * You must be a MAINTAINER of this repo for that button to appear.
# * Enter the name of the package to be tested.
#
# That package is installed on both Lua 5.4 and 5.5 on macOS, Ubuntu, and Windows.

name: itinerant_hererocks
run-name: itinerant_hererocks ${{ inputs.package }}
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to test (e.g., moonscript)'
        required: true
jobs:
  itinerant_hererocks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        lua-version: ["5.1", "5.2", "5.3", "5.4", "5.5"]
        luarocks-version: [latest]
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - if: runner.os == 'macOS'
        run: brew install readline
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get -q -q update
          sudo apt-get install --yes libreadline-dev
      - if: runner.os == 'Windows'
        run: choco install readline
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - env:
          REPO: git+https://github.com/luarocks/hererocks.git
        run: uvx --from=$REPO hererocks lua_venv --lua=${{ matrix.lua-version }} --luarocks=${{ matrix.luarocks-version }}
      - run: |
          source lua_venv/bin/activate  # Adds 'lua_venv/bin' to $PATH.
          lua -v && luarocks --version
          luarocks config --lua-version=${{ matrix.lua-version }}
          luarocks install --check-lua-versions ${PACKAGE}
          luarocks list  # other dependencies that are installed
          luarocks show ${PACKAGE}
          luarocks doc ${PACKAGE}
          luarocks test ${PACKAGE} || true
