name: FreeBSD Lua Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  freebsd-test:
    runs-on: ubuntu-latest
    name: Test on FreeBSD
    steps:
      - uses: actions/checkout@v7

      - name: Run in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.1"
          usesh: true
          prepare: |
            pkg install -y lua51-luarocks lua55-luarocks
          run: |
            lua51 -v
            luarocks51 --version || true
            luarocks55 --version || true
            luarocks55 || true
            luarocks51 || true
            luarocks51 --lua-version=5.5 --version || true
            luarocks51 --lua-version=5.5
