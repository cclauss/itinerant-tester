name: FreeBSD Lua Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  freebsd-test:
    name: Test on FreeBSD
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua-version: [51, 52, 53, 54, 55]
    steps:
      - uses: actions/checkout@v7

      - name: Run in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          # release: "14.1"
          usesh: true
          prepare: |
            pkg install -y lua${{ matrix.lua-version }}-luarocks lua55-luarocks
          run: |
            lua${{ matrix.lua-version }} -v
            luarocks${{ matrix.lua-version }} --version || true
            luarocks${{ matrix.lua-version }} || true
            luarocks${{ matrix.lua-version }} --lua-version=5.5 --version
