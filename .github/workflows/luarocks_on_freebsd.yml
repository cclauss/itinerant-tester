name: FreeBSD Lua Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  freebsd-test:
    name: Test on FreeBSD
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua-version: [51, 52, 53, 54, 55]
    steps:
      - uses: actions/checkout@v7

      - name: Run in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          # release: "14.1"
          usesh: true
          prepare: |
            pkg install -y lua55 lua${{ matrix.lua-version }}-luarocks
          run: |
            echo "--- START... --------"
            echo "--- lua${{ matrix.lua-version }} -v"
            lua${{ matrix.lua-version }} -v

            # Demonstrate failure of luarocks51...
            echo "--- luarocks${{ matrix.lua-version }} --version"
            echo "---> luarocks51 will FAIL here."
            luarocks${{ matrix.lua-version }} --version || true

            echo "--- luarocks${{ matrix.lua-version }}"
            echo "---> luarocks51 will also FAIL here."
            luarocks${{ matrix.lua-version }}

            echo "--- lua55 -v"
            pkg install -y lua55
            lua55 -v

            # Demonstrate failure of luarocks52 --lua-version=5.5
            echo "--- luarocks${{ matrix.lua-version }} --lua-version=5.5 --version"
            echo "---> luarocks52 will FAIL here."
            luarocks${{ matrix.lua-version }} --lua-version=5.5 --version || true

            echo "--- luarocks${{ matrix.lua-version }} --lua-version=5.5"
            echo "---> luarocks52 will also FAIL here."
            luarocks${{ matrix.lua-version }} --lua-version=5.5
