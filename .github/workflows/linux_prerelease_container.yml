# Create a Service Container built on a pre-release or non-Ubuntu version of Linux
# Buildable Ubuntu versions can be found at http://ports.ubuntu.com/ubuntu-ports/dists

# Ubuntu releases: https://releases.ubuntu.com
# https://ubuntu.com/about/release-cycle -- Try here first and then fall back to:
# https://en.wikipedia.org/wiki/Ubuntu_version_history#Table_of_versions

# Debian releases: https://www.debian.org
# https://en.wikipedia.org/wiki/Debian_release_version_history#Release_table

name: linux_prerelease_container
on:
  push:
    paths:
      - '.github/workflows/linux_prerelease_container.yml'
  pull_request:
    paths:
      - '.github/workflows/linux_prerelease_container.yml'
  workflow_dispatch:
jobs:
  # ubuntu_26_10:
  #  runs-on: ubuntu-26.10  # Not yet available on GitHub Actions
  #  steps:
  #    - run: |
  #        echo "Running on: ubuntu-26.10"

  linux_prerelease_container:
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.os }}
      options: --privileged
    strategy:
      fail-fast: false  # don't cancel if any job from the matrix fails
      matrix:
        include:  # https://github.com/cclauss/lunatic-python/pull/16
          - os: debian:trixie  # Debian GNU/Linux 13 (trixie) -- Python 3.14.6
          - os: ubuntu:26.04   # Ubuntu Resolute Racoon -- Python 3.14.6
          # Prerelease Linux
          - os: ubuntu:26.10   # Ubuntu Stonking Stingray (development branch) -- Python 3.14.6
          - os: debian:forky   # Debian GNU/Linux 14 (forky) -- Python 3.14.6
          - os: debian:testing  # The staging area for the next stable release.
          - os: debian:unstable  # The actual rolling development branch. New upstream versions land here first.
          - os: debian:experimental  # Not a full distribution — it's an overlay/staging area layered on top of unstable, containing risky packages.
    steps:  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/find-and-customize-actions#referencing-a-container-on-docker-hub
      # - uses: docker://${{ matrix.os }}  # Why is '${{ matrix.os }}' unknown in this context?
      - env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Europe/Paris
        run: |
          apt update
          echo "> upgradable lua"
          apt list --upgradable | grep lua || true
          echo "> lua5.5 is not available on debian:trixie"
          apt install --yes lsb-release nodejs python3 lua5.4 liblua5.4-dev lua5.5 liblua5.5-dev luarocks
          lsb_release --all
          lsb_release -ds
          node --version
          python3 -V
          echo "-- Lua:"
          lua -v  # apt install luarocks (< v3.13.0) DOWNGRADES the default `lua` from 5.5 down to 5.1.
          echo ">lua5.5 is not available on debian:trixie"
          echo ">lua5.5.0 on ubuntu:26.04 and debian:forky."
          echo ">lua5.5.1 on ubuntu:26.10 and debian:{testing,unstable,experimental}."
          lua5.5 -v
          luarocks --version
          # 2026_07_30: lua5.5 5.5.0-5 MIGRATED to testing -- Fixes the #define macro issue on Debian Forky.
          echo "> luarocks v3.8.0, not v3.11.1 on ubuntu:26.04 so..."
          echo "> Lua 5.5 version with #define macro bug is not fixed on ubuntu:26.04."
          # https://bugs.launchpad.net/ubuntu/+source/lua5.5/+bug/2160598 is fixed on Ubuntu Stonking and Debian Forky.
          export PCDIR=$(pkgconf lua5.5 --variable pcfiledir)
          head -n4 $PCDIR/lua5.5.pc
          # diff /usr/include/lua5.4/lua.h /usr/include/lua5.5/lua.h
          # cat /usr/include/lua5.5/lua.h
          # ---
          echo "> LUA_INCDIR and LUA_INCDIR_OK are defined on Lua 5.4 but not on Lua 5.5."
          luarocks --lua-version=5.4 config | grep INC
          echo "> LUA_INCDIR and LUA_INCDIR_OK are NOT defined on ubuntu:26.04 Lua 5.5."
          # https://bugs.launchpad.net/ubuntu/+source/lua5.5/+bug/2160601 is fixed on later Linux.
          # https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=1142093 is fixed on later Linux.
          luarocks --lua-version=5.5 config | grep INC
