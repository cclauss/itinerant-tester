# Can a package be installed on Lua 5.4 and 5.5 on macOS, Ubuntu, and Windows?
# Unlike most other workflows, this one is NOT run on pushes and pull requests.
#
# This workflow is only run ON DEMAND by MAINTAINERS of this repo when they
# want to know if a Lua package can be installed on both Lua 5.4 and 5.5.
#
# https://github.com/cclauss/itinerant-tester/actions/workflows/luarocks_install.yml
# * Click the "Run workflow" button at the upper right of the page.
#     * You must be a MAINTAINER of this repo for that button to appear.
# * Enter the name of the package to be tested.
#
# That package is installed on both Lua 5.4 and 5.5 on macOS, Ubuntu, and Windows.

name: luarocks_install
run-name: luarocks install ${{ inputs.package }} with apt install ${{ inputs.apt_package }}
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to test (e.g., moonscript)'
        required: true
      apt_package:
        description: 'apt-get packages to install'
        required: false

jobs:
  luarocks_install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        lua-version: [5.4, 5.5]  # [5.1, 5.2, 5.3, 5.4, 5.5]
        luarocks-version: ["3.13.0"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # Make Windows work like macOS and Linux.
    env:
      PACKAGE: ${{ inputs.package }}
      APT_PACKAGE: ${{ inputs.apt_package }}
    steps:
      - run: echo "Installing ${PACKAGE} on ${{ matrix.os }} on ${{ runner.arch }}..."
      - if: runner.os == 'Linux' && inputs.apt_package  # Only Linux has apt-get.
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes ${APT_PACKAGE}
      - if: runner.os == 'Windows' && inputs.apt_package == 'libbz2-dev'
        run: choco install bzip2
      - if: runner.os == 'Windows'  # Windows requires the MSVC cl tool.
        uses: step-security/msvc-dev-cmd@v1
      - run: cl || clang --version
      - uses: luarocks/gh-actions-lua@master
        with:
          luaVersion: ${{ matrix.lua-version }}
      - uses: luarocks/gh-actions-luarocks@master
        with:
          luaRocksVersion: ${{ matrix.luarocks-version }}
      - run: lua -v && luarocks --version
      - run: luarocks --lua-version=${{ matrix.lua-version }} install --check-lua-versions ${PACKAGE} --local
      - run: luarocks --lua-version=${{ matrix.lua-version }} list  # other dependencies that are installed
      - run: luarocks --lua-version=${{ matrix.lua-version }} show ${PACKAGE}
      - run: luarocks --lua-version=${{ matrix.lua-version }} doc ${PACKAGE}
      - run: luarocks --lua-version=${{ matrix.lua-version }} test ${PACKAGE} || true
