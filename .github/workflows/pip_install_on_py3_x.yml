name: pip_install_on_py3_x
on:
  push:
    paths:
      - 'pip_install_on_py3_x.yml'
  pull_request:
    paths:
      - 'pip_install_on_py3_x.yml'
  workflow_dispatch:
jobs:
  pip_install_on_py3_x:
    strategy:
      fail-fast: false
      matrix:
        module:
          # My modules
          - cpplint
          - django-celery-beat
          - pyfluidsynth
          - pyttsx3
          - tap2junit
          - web-py
          # Others
          - ament-black
          - celery
          - contourpy
          - cssbeautifier
          - django-celery-beat
          - django-haystack
          - dronecan
          - greenlet
          - h5py
          - keras
          - lxml
          - Pillow
          - pyproject_api
          - pyproject_hooks
          - pysolr
          - PyWavelets  # - git+https://github.com/PyWavelets/pywt.git
          - qiskit
          - git+https://github.com/Qiskit/qiskit.git
          - scikit-fuzzy
          - scikit-image
          - scikit-learn
          - statsmodels
          - symengine
          - tensorflow
          - git+https://github.com/tensorflow/tensorflow.git
          # - ament-clang-tidy
          # - ament-lint
          # - ament-lint-cmake-py
          # - ament-lint-flake8
          # - ament-lint-pep257
          # - ament-mypy
          # - ament-pycodestyle
          # - ament-style-uncrustify
          # - ament-xmllint
          # - MySQL-python
          # - wave
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.15t
        allow-prereleases: true
    - if: matrix.module == 'h5py' || matrix.module == 'keras' 
      run:
          sudo apt-get update && sudo apt-get install -y libhdf5-dev
    # - if: matrix.module == 'lxml'
    #  run:
    #      sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt-dev
    # - if: matrix.module == 'Pillow'
    #  run:
    #      sudo apt-get update && sudo apt-get install -y libtiff5-dev libjpeg8-dev libopenjp2-7-dev
    #      zlib1g-dev libfreetype6-dev liblcms2-dev libwebp-dev tcl8.6-dev tk8.6-dev python3-tk
    #      libharfbuzz-dev libfribidi-dev libxcb1-dev
    #- run: pip install ${{ matrix.module }}
    #- run: pip uninstall -y ${{ matrix.module }}
    - run: pip install --upgrade pip
    - run: pip install ${{ matrix.module }}
